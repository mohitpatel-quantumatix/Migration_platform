# ============================================================
#  Migration Platform - Cloud Migration Config
#  Source: Local PostgreSQL (shop_db)
#  Target: Azure Database for PostgreSQL
#
#  HOW TO USE:
#  1. Fill in your Azure connection details below (marked TODO)
#  2. Set your password env vars in PowerShell:
#       $env:SECRET_source_db_pass = "Migration@123"
#       $env:SECRET_azure_db_pass  = "your_azure_admin_password"
#  3. Run:
#       python -m migration_platform --config config\azure_config.yaml --mode full
# ============================================================

# SOURCE DATABASE - Local PostgreSQL (shop_db)
source:
  engine: postgresql
  connection:
    host: localhost
    port: 5432
    database: shop_db
    username: postgres
    password_secret: source_db_pass       # reads $env:SECRET_source_db_pass
    ssl: false

# TARGET DATABASE - Azure Database for PostgreSQL
target:
  engine: postgresql
  connection:
    host: pgsql-flex-hybrid-01.postgres.database.azure.com
    port: 5432
    database: shop_db                               # database on Azure (will be created if missing)
    username: rootuser
    password_secret: azure_db_pass                 # reads $env:SECRET_azure_db_pass
    ssl: true                                       # Azure PostgreSQL always requires SSL
    # ssl_ca_cert: C:\path\to\DigiCertGlobalRootCA.crt.pem  # optional: path to Azure CA cert

# MIGRATION SETTINGS
migration:
  mode: full
  batch_size: 500          # smaller batches are safer over cloud network

# RETRY / RESILIENCE (higher values for cloud latency)
retry:
  max_retries: 5
  base_delay_seconds: 2.0
  max_delay_seconds: 60.0
  circuit_breaker_max_failures: 5
  circuit_breaker_reset_timeout_seconds: 60.0

# SECRETS PROVIDER
secrets:
  provider: env

# ALERTING (optional - add Slack/Teams webhook to get notified when done)
alerting:
  notifier: none
  # notifier: slack
  # webhook_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK

# VALIDATION
validation:
  mode: count
  sample_size: 1000

# LOGGING
logging:
  level: INFO
  file: migration_azure.log   # logs saved to file for review
